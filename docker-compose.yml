services:
  node1:
    build: .
    container_name: tattva_node1
    environment:
      NODE_URL: "http://node1:8000"
      MAIN_API_URL: "http://host.docker.internal:8000"
      FEDERATED_NODES: "http://node1:8000,http://node2:8000,http://node3:8000,http://node4:8000"
      BLOCK_ENCRYPTION_KEY: "${BLOCK_ENCRYPTION_KEY:-LULSnIHlBjTSfWDfqVl0kTV9qXUFN0EpGbynAB_34TM=}"
      SECURE_TRANSFER_KEY: "${SECURE_TRANSFER_KEY:-LULSnIHlBjTSfWDfqVl0kTV9qXUFN0EpGbynAB_34TM=}"
      SECURE_TRANSFER_KEY_ID: "${SECURE_TRANSFER_KEY_ID:-tattvadrishti-demo-key-v1}"
      SECURE_TRANSFER_NODE_ID: "partner-node-usa"
      SECURE_TRANSFER_NODES: "USA=http://node1:8000,EU=http://node2:8000,IN=http://node3:8000,AUS=http://node4:8000"
      APP_SECRET: "federated-secret-node1"
      DISABLE_AI_MODELS: "true"
    volumes:
      - ./data/node1:/app/data
    ports:
      - "8001:8000"
    networks:
      - federated_chain

  node2:
